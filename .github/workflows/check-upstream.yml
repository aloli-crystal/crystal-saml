name: Check upstream ruby-saml

on:
  schedule:
    - cron: "0 8 * * 1"  # Every Monday at 08:00 UTC
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check latest ruby-saml version
        id: check
        run: |
          LATEST=$(curl -s https://rubygems.org/api/v1/versions/ruby-saml/latest.json | jq -r '.version')
          CURRENT="1.18.1"
          echo "latest=$LATEST" >> $GITHUB_OUTPUT
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          if [ "$LATEST" != "$CURRENT" ]; then
            echo "outdated=true" >> $GITHUB_OUTPUT
          else
            echo "outdated=false" >> $GITHUB_OUTPUT
          fi

      - name: Create issue if outdated
        if: steps.check.outputs.outdated == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const latest = '${{ steps.check.outputs.latest }}';
            const current = '${{ steps.check.outputs.current }}';
            const title = `Upstream ruby-saml updated to v${latest}`;
            const body = `The upstream ruby-saml gem has been updated to v${latest}.\nCurrent saml tracks v${current}.\n\nPlease review the changes: https://github.com/SAML-Toolkits/ruby-saml/releases`;

            // Check if issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'upstream'
            });

            const existing = issues.data.find(i => i.title.includes('ruby-saml updated'));
            if (!existing) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['upstream']
              });
            }
